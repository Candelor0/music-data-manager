[project]
name = "mds"
version = "0.5.1"
description = "音乐数据管家 —— 本地音乐元数据管理工具"
# 继承 Picard（GPL-2.0-or-later），但因链接 PyQt5（GPL v3），整体按 v3 分发。
# 说明与第三方清单见 licenses/README.md；全文见 LICENSE。
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mutagen>=1.48",
    "pydantic>=2.9",
    "httpx>=0.27",
    "platformdirs>=4.2",
    # 复用 Picard 的 formats 层做标签读写。
    # 钉死版本：PyPI wheel 可直接安装（macOS + Windows），无需构建、不依赖 msgfmt。
    # ⚠️ 它会把 PyQt5 带进来 —— 同一环境里不得再装 PyQt6（两套 Qt 绑定会崩）。
    "picard==2.13.3",
    # 界面框架：与 picard 同用 PyQt5（**不得装 PyQt6**，两套 Qt 绑定同进程会崩）。
    # 这里是显式声明，因为 ui/ 直接 import PyQt5。
    "PyQt5>=5.15.9,<5.16",
    # 密钥持久化：设置页把 Key 存进系统凭据库（Windows 凭据管理器 / macOS 钥匙串）。
    # 由「可选」提升为「必需」—— 约定：填一次就不用再输。
    # Windows 上靠 pywin32-ctypes，macOS/Linux 各有自带后端（共 6 个纯 Python 包，约 856 KB）。
    "keyring>=25",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
mds = "mds.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mds"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# 让锁文件同时覆盖 Windows，否则在 macOS 上生成的锁会把
# pyqt5-qt5 锁到只有 macOS/Linux 轮子的版本，Windows 上装不上。
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
